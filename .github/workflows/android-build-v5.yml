name: Build Android App — Canonical Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sadiq-android-release
  cancel-in-progress: false

env:
  EXPECTED_SIGNING_SHA256: F5:0D:DC:2F:8B:BE:D5:F3:E8:67:CC:EE:32:3D:94:AB:D5:84:B0:41:F0:3A:02:2C:03:C7:B1:F6:DA:B1:76:54
  KEY_ALIAS: sadiq

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Restore canonical signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore

          ACTUAL_SHA256="$(
            keytool -list -v \
              -keystore android.keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1 \
            | tr -d '\r'
          )"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "Signing certificate mismatch. Refusing to build an incompatible Android update." >&2
            echo "Expected: $EXPECTED_SIGNING_SHA256" >&2
            echo "Actual:   $ACTUAL_SHA256" >&2
            rm -f android.keystore
            exit 1
          fi

          echo "Canonical Android signing certificate verified."

      - name: Generate and build Android app
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          docker run --rm \
            --entrypoint /bin/bash \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD" \
            -e BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEY_PASSWORD" \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/googlechromelabs/bubblewrap@sha256:01b3d5cdcdb670edd8ee00654c36f978896da78dfd7cc7e62814b83268c6f53b \
            -lc '
              set -euo pipefail

              SDK_ROOT="/root/.bubblewrap/android_sdk"

              bubblewrap update --skipVersionUpgrade --manifest=/workspace/twa-manifest.json

              SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
              test -n "$SDKMANAGER"

              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
                "build-tools;35.0.0" \
                "platforms;android-36"

              bubblewrap build \
                --skipPwaValidation \
                --manifest=/workspace/twa-manifest.json \
                --signingKeyPath=/workspace/android.keystore \
                --signingKeyAlias=sadiq
            '

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          AAB="$(find . -type f -name '*.aab' | head -n 1)"
          APK="./app-release-signed.apk"
          ASSETLINKS="$(find . -type f -path '*/.well-known/assetlinks.json' | head -n 1 || true)"

          test -n "$AAB"
          test -f "$APK"

          cp "$AAB" release/sadiq-play-release.aab
          cp "$APK" release/sadiq-android-release.apk

          if [ -n "$ASSETLINKS" ]; then
            cp "$ASSETLINKS" release/assetlinks.json
          fi

          sha256sum \
            release/sadiq-play-release.aab \
            release/sadiq-android-release.apk \
            > release/SHA256SUMS.txt

          rm -f android.keystore

      - name: Upload Android release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sadiq-android-canonical-release
          path: release/
          if-no-files-found: error
          retention-days: 30
