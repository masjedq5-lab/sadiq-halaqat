name: Export Legendary Sadiq Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify security and production build
        run: |
          npm run security:scan
          npm run lint
          npm run build
          npm run security:csp
          npm run security:dist

      - name: Prepare clean verified source backup
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(date -u +'%Y.%m.%d-%H%M')"
          ROOT="export/Sadiq-Halaqat-LEGENDARY"
          ARCHIVE="Sadiq-Halaqat-LEGENDARY-${VERSION}.zip"
          mkdir -p "$ROOT"

          rsync -a ./ "$ROOT/" \
            --exclude '.git/' \
            --exclude 'export/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'security-artifacts/' \
            --exclude '*.keystore' \
            --exclude '*.jks' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.vercel/'

          cat > "$ROOT/BACKUP_INFO.txt" <<INFO
          Project: الصديق - نظام إدارة الحلقات
          Repository: ${{ github.repository }}
          Branch: main
          Commit: ${{ github.sha }}
          Exported: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Verification: security scan + lint + build + CSP + dist scan = SUCCESS

          Security rules:
          - No environment files
          - No Android signing keys
          - No Vercel local credentials
          - No node_modules or dist
          - Source maps remain disabled in production
          INFO

          cd export
          zip -r -9 "$ARCHIVE" Sadiq-Halaqat-LEGENDARY >/dev/null
          sha256sum "$ARCHIVE" > SHA256SUMS.txt
          printf '%s\n' "$ARCHIVE" > ARCHIVE_NAME.txt

      - name: Upload verified source backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Sadiq-Halaqat-LEGENDARY-${{ github.run_number }}
          path: |
            export/*.zip
            export/SHA256SUMS.txt
            export/ARCHIVE_NAME.txt
          if-no-files-found: error
          retention-days: 30
