name: Sadiq Security Sentinel V Infinity

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-audit:
    name: Core security audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare report directory
        run: mkdir -p security-artifacts

      - name: Sadiq Sentinel static audit
        run: npm run security:sentinel

      - name: Repository secret and source hygiene
        run: npm run security:scan

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high --json > security-artifacts/npm-audit.json

      - name: Edge security regression tests
        run: npm run security:edge

      - name: Login and credential sharing regression tests
        run: npm run security:ui

      - name: Side lesson recitation and monthly achievement tests
        run: npm run test:side-lessons

      - name: Absent student recitation regression tests
        run: npm run test:attendance

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify CSP hashes against built HTML
        run: npm run security:csp

      - name: Production artifact security scan
        run: npm run security:dist

      - name: Live production surface scan
        continue-on-error: true
        env:
          SECURITY_TARGET_URL: https://sadiqh.vercel.app
        run: npm run security:live

      - name: Write job summary
        if: always()
        run: |
          echo "# Sadiq Security Sentinel V Infinity" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f security-artifacts/sentinel-report.md ]; then
            cat security-artifacts/sentinel-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f security-artifacts/live-scan.md ]; then
            cat security-artifacts/live-scan.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create clean source snapshot
        if: always()
        run: |
          set -euo pipefail
          mkdir -p security-artifacts/source
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='security-artifacts' \
            --exclude='*.keystore' \
            --exclude='*.jks' \
            --exclude='.env*' \
            ./ security-artifacts/source/
          cd security-artifacts
          zip -qr sadiq-security-v-infinity-source.zip source
          rm -rf source

      - name: Upload core audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sadiq-security-v-infinity-core-${{ github.run_number }}
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Block release on high or critical Sentinel findings
        if: always() && hashFiles('security-artifacts/sentinel-report.json') != ''
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('security-artifacts/sentinel-report.json','utf8'));
          if ((report?.counts?.critical || 0) > 0 || (report?.counts?.high || 0) > 0) {
            console.error('High or critical security finding detected. Release gate closed.');
            process.exit(1);
          }
          NODE

  codeql:
    name: CodeQL deep analysis
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Deep SAST with Semgrep
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.178.0"

      - name: Run Semgrep
        run: |
          mkdir -p security-artifacts
          semgrep scan             --error --severity ERROR --config auto             --exclude node_modules             --exclude dist             --exclude security-artifacts             --exclude-rule html.security.audit.missing-integrity.missing-integrity             --json             --output security-artifacts/semgrep.json             .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sadiq-security-v-infinity-semgrep-${{ github.run_number }}
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

  trivy:
    name: Trivy dependency secret and misconfiguration scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare report directory
        run: mkdir -p security-artifacts

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: security-artifacts/trivy.sarif
          exit-code: "1"

      - name: Upload Trivy SARIF to GitHub code scanning
        if: always() && hashFiles('security-artifacts/trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          sarif_file: security-artifacts/trivy.sarif
          category: trivy

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sadiq-security-v-infinity-trivy-${{ github.run_number }}
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

  supabase-lint:
    name: Optional live Supabase database lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare report directory
        run: mkdir -p security-artifacts

      - name: Run Supabase lint when secrets are configured
        continue-on-error: true
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            printf '%s\n'               '# Supabase live lint'               ''               'Skipped: configure SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_REF as GitHub Actions secrets.'               > security-artifacts/supabase-live-lint.md
            exit 0
          fi

          npx --yes supabase@2.118.0 link             --project-ref "$SUPABASE_PROJECT_REF"             --password "$SUPABASE_DB_PASSWORD"

          npx --yes supabase@2.118.0 db lint             --linked             --level warning             > security-artifacts/supabase-db-lint.txt 2>&1 || true

      - name: Upload Supabase lint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sadiq-security-v-infinity-supabase-${{ github.run_number }}
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

  zap-baseline:
    name: Safe OWASP ZAP baseline
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run passive/baseline web scan
        continue-on-error: true
        run: |
          mkdir -p security-artifacts/zap
          chmod 777 security-artifacts/zap
          docker run --rm             -v "$PWD/security-artifacts/zap:/zap/wrk/:rw"             -t ghcr.io/zaproxy/zaproxy:2.17.0             zap-baseline.py             -t https://sadiqh.vercel.app             -J zap-report.json             -r zap-report.html             -w zap-report.md             -I || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sadiq-security-v-infinity-zap-${{ github.run_number }}
          path: security-artifacts/zap/
          if-no-files-found: warn
          retention-days: 30
